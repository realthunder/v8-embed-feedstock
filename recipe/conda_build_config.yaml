# Where the build resolves deps from, and where the artifact is labelled for.
# Kept here rather than only in the rendered .ci_support files so a
# `conda smithy rerender` cannot reset them (the arrangement
# freecad-rt-feedstock and smesh-feedstock use).
#
# Nothing here is built against a realthunder package -- the build needs a
# compiler, python, ninja and ICU -- so conda-forge is the only source, which
# also keeps strict channel priority out of the way.
channel_sources:
  - conda-forge
channel_targets:
  - realthunder main

# Inherited from nodejs-feedstock: node's V8 uses glibc features that 2.17
# does not have.
c_stdlib_version:                                   # [linux]
  - "2.28"                                          # [linux]


# Which clang-cl builds the Windows package, and through which generator.
# V8 stopped compiling with MSVC at 13.0 (node followed at 24), so cl.exe is
# not a choice; where the clang-cl comes from still is.  Both are built until
# one has proven itself, then the other goes.  See bld.bat.
#
#   conda-clang-cl  conda-forge's clang-cl (pinned; compiler('clang') in the
#                   recipe) with ninja, the generator every other platform uses.
#   vs-clang-cl     the clang-cl inside Visual Studio on the CI image, through
#                   MSBuild's ClangCL toolset -- the build node itself tests.
v8_win_toolchain:                                   # [win]
  - conda-clang-cl                                  # [win]
  - vs-clang-cl                                     # [win]
