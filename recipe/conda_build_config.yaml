# Where the build resolves deps from, and where the artifact is labelled for.
# Kept here rather than only in the rendered .ci_support files so a
# `conda smithy rerender` cannot reset them (the arrangement
# freecad-rt-feedstock and smesh-feedstock use).
#
# Nothing here is built against a realthunder package -- the build needs a
# compiler, python, ninja and ICU -- so conda-forge is the only source, which
# also keeps strict channel priority out of the way.
channel_sources:
  - conda-forge
channel_targets:
  - realthunder main

# Inherited from nodejs-feedstock: node's V8 uses glibc features that 2.17
# does not have.
c_stdlib_version:                                   # [linux]
  - "2.28"                                          # [linux]

github_actions_labels:                      # [linux]
  - namespace-profile-16cpu-on-linux-64     # [linux64]
  - namespace-profile-8cpu-on-linux-aarch64 # [linux and aarch64]
