schema_version: 1

context:
  # The V8 in node's deps/v8, from deps/v8/include/v8-version.h.  This is the
  # package's version: what ships is V8, and node is only how it is built.
  version: "14.6.202.34"
  node_version: "26.6.0"
  build: 1

package:
  name: v8-embed
  version: ${{ version }}

source:
  # checksums from https://nodejs.org/dist/vX.Y.Z/SHASUMS256.txt.asc
  url: https://nodejs.org/dist/v${{ node_version }}/node-v${{ node_version }}.tar.gz
  sha256: 0c1a4512ceb6ab37404900762cf325326faafed9ea96e726af6b003acf22322a
  patches:
    # Carried from conda-forge/nodejs-feedstock, so a node bump can take
    # their patch set as it stands.  The two of theirs that only touch code
    # this build never compiles -- system abseil, and stdlib.h for the fmt
    # vendored under deps/LIEF -- are dropped rather than kept dormant.
    - patches/0001-stop-removing-librt.patch
    - patches/0002-include-obj-name-in-shared-intermediate.patch
    - patches/0003-Forward-ceilf-floorf.patch
    - patches/0006-Guard-V8-JSON-SIMD-path-on-scalar-only-Highway-targe.patch
    - patches/0007-Guard-V8-string-hasher-SIMD-path-on-scalar-only-High.patch
    - patches/0008-Explicitly-instantiate-FloatMinMaxHelper-on-RISC-V.patch
    # Ours, numbered clear of theirs.
    - patches/0100-Let-a-build-ask-gyp-for-a-shared-V8.patch
    - patches/0101-Give-abseil-the-build-configuration-V8-targets-get.patch
    - patches/0102-Let-the-inspector-config-name-its-own-protocol-file.patch
    - patches/0103-Hide-the-bundled-ICU-s-symbols.patch
    - patches/0104-Let-a-ninja-build-on-Windows-compile-with-clang-cl.patch
    - patches/0105-Write-pch-cflags-as-a-list-not-a-map-object.patch
    - patches/0106-Translate-LanguageStandard-for-the-ninja-generator-too.patch
    - patches/0107-Tell-genccode-the-CPU-architecture-under-clang-cl.patch
    - patches/0108-Link-the-whole-engine-into-the-Windows-DLL.patch
    - patches/0109-Run-a-Windows-action-s-executable-without-the-shell.patch
    - patches/0110-torque-find-a-source-whatever-separator-it-was-named-with.patch

build:
  number: ${{ build }}
  script:
    file: ${{ "bld.bat" if win else "build.sh" }}
    env:
      # Which clang-cl, and through which generator; the values are in
      # conda_build_config.yaml and bld.bat is where they mean something.
      V8_WIN_TOOLCHAIN: ${{ v8_win_toolchain if win else "" }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    # On Windows the C/C++ compiler above is MSVC, which V8 no longer compiles
    # with; it stays for its activation -- INCLUDE, LIB, link.exe, MSBuild --
    # and the compiler is clang-cl.  conda-forge's clang-cl package, when the
    # variant asks for it (compiler('clang') resolves to it on Windows); the
    # one inside Visual Studio otherwise, which needs nothing from here.
    - if: win and v8_win_toolchain != "vs-clang-cl"
      then:
        - ${{ compiler('clang') }}
        - ${{ compiler('clangxx') }}
    # c.f. https://github.com/nodejs/node/blob/v26.6.0/pyproject.toml
    - python 3.13.*
    - ninja
    - if: unix
      then: sed
  # No host requirements at all.  ICU is node's bundled small-icu, compiled
  # into the library, and nothing else is linked from this prefix -- so the
  # package depends on nothing but libc and the C++ runtime.

  run_exports:
    # V8 offers no ABI stability between any two versions, not even patch
    # levels: the public headers inline code that reads object layouts the
    # engine decides at compile time.  The SONAME says the same thing.
    - ${{ pin_subpackage('v8-embed', upper_bound='x.x.x.x') }}

tests:
  - package_contents:
      include:
        - v8.h
        - v8-isolate.h
        - v8-context.h
        - v8config.h
        # Generated here, not by V8: the configuration the headers read.
        - v8-gn.h
        - libplatform/libplatform.h
        - cppgc/heap.h
      files:
        - if: win
          then:
            # A DLL in bin/ and its import library in lib/, which is where a
            # conda prefix on Windows keeps them.
            - Library/bin/v8.dll
            - Library/lib/v8.lib
            - Library/lib/pkgconfig/v8-embed.pc
            - Library/lib/cmake/v8-embed/v8-embed-config.cmake
          else:
            - lib/pkgconfig/v8-embed.pc
            - lib/cmake/v8-embed/v8-embed-config.cmake
      lib:
        - if: unix
          then: v8

  # Compiles and RUNS an embedder.  The point is not that the library exists
  # but that the three pieces agree: the headers describe the engine that was
  # linked, the default platform and the snapshot are both inside the one
  # library, and a context can be created and a script run.  A V8 whose
  # snapshot or libplatform got dropped at link time passes every static check
  # and then dies on the first isolate.
  - if: build_platform == target_platform
    then:
      script:
        - cmake -G Ninja -B build -S test_consumer -DCMAKE_BUILD_TYPE=Release
        - cmake --build build
        - ctest --test-dir build --output-on-failure --build-config Release
      requirements:
        run:
          - ${{ compiler('cxx') }}
          - ${{ stdlib('c') }}
          - cmake
          - ninja
      files:
        recipe:
          - test_consumer/

about:
  homepage: https://v8.dev/
  repository: https://github.com/v8/v8
  documentation: https://v8.dev/docs/embed
  # V8 itself is BSD-3-Clause, but the library is not: V8 links its own copy
  # of glibc's sin/cos (deps/v8/third_party/glibc, LGPL-2.1-or-later) and a
  # handful of permissively licensed vendored libraries.  Shipping it as a
  # shared library with the source URL in the recipe satisfies the LGPL, and
  # all of it is compatible with linking into an LGPL-2.1+ application.
  license: BSD-3-Clause AND Apache-2.0 AND MIT AND LGPL-2.1-or-later AND Zlib
  # V8's own umbrella license and the two it names, plus a license for every
  # vendored library whose code is linked into the shipped object.  node's
  # MIT is not among them: none of node ships here.
  license_file:
    - deps/v8/LICENSE
    - deps/v8/LICENSE.v8
    - deps/v8/LICENSE.fdlibm
    - deps/v8/LICENSE.strongtalk
    - deps/v8/third_party/abseil-cpp/LICENSE
    - deps/v8/third_party/fp16/LICENSE
    - deps/v8/third_party/glibc/LICENSE
    - deps/v8/third_party/highway/LICENSE
    - deps/v8/third_party/inspector_protocol/LICENSE
    - deps/v8/third_party/rapidhash-v8/LICENSE
    - deps/v8/third_party/simdutf/LICENSE
    - deps/v8/third_party/siphash/LICENSE
    - deps/v8/third_party/utf8-decoder/LICENSE
    - deps/v8/third_party/wasm-api/LICENSE
    - deps/zlib/LICENSE
  summary: The V8 JavaScript engine, built as a shared library to embed
  description: |
    V8 as one shared library plus its public headers: the engine, its default
    platform, its startup snapshot, and nothing else.  It is the engine an
    application embeds when it wants to run JavaScript or WebAssembly inside
    its own process.

    Engine only, deliberately.  There is no convenience API and no ready-made
    context in this package; an embedder creates the isolate and populates the
    global object itself.  That is the security property it exists for: a bare
    V8 has no filesystem, no network, no process object and no module loader,
    because those are things a host adds.  A guest gets what the embedder
    explicitly puts in front of it and there is nothing else in the engine to
    reach.  A package that shipped a default environment would take that away.

    Built from the V8 that node vendors, using node's GYP files, because that
    is the only way to build V8 with an ordinary toolchain -- upstream's own
    build wants depot_tools, gclient and a downloaded clang.  It also means
    this inherits the V8 that node keeps current and the patches node carries.
